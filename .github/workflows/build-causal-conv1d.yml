name: CausalConv1d

permissions: {}

on:
  pull_request:
    branches: [main, "charlie/gpu-audit-*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.release_tag || github.sha }}
  cancel-in-progress: true

jobs:
  plan-matrix:
    name: Plan CausalConv1d build matrix
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    permissions:
      contents: read # for actions/checkout
    outputs:
      batches: ${{ steps.generate-matrix.outputs.batches }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.9.26"
          enable-cache: false

      - name: Generate build matrix
        id: generate-matrix
        run: |
          matrix=$(uv run --script plan-matrix.py)
          batches=$(jq -c 'group_by(.["target-arch"]) | map({"target-arch": .[0]["target-arch"], "build-matrix": tojson})' <<< "${matrix}")
          echo "batches=${batches}" >> "$GITHUB_OUTPUT"
        env:
          LIMIT_MATRIX: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-build') && '1' || '0' }}

  build-wheels:
    name: Build Wheels (${{ matrix.target-arch }})
    needs: [plan-matrix]
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-matrix.outputs.batches) }}
    uses: ./.github/workflows/build-wheels-batch.yml
    with:
      matrix: ${{ matrix.build-matrix }}
      release_tag: ${{ inputs.release_tag || '' }}

  create-release:
    name: Create release
    if: github.event_name == 'workflow_dispatch'
    needs: [build-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh release create "${RELEASE_TAG}" ./dist/*.whl
          --target "${GITHUB_SHA}"
          --title "${RELEASE_TAG}"
          --notes ""
          --repo "${GITHUB_REPOSITORY}"
